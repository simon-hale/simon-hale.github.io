<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        let preference = 'system'
        try {
          preference = localStorage.getItem('portfolio-theme') || 'system'
        } catch {}
        const followsDark = preference !== 'light' && preference !== 'dark'
          && window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'dark' || followsDark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#151514' : '#f4f4f1')

        let locale = 'zh-Hans'
        try {
          const savedLocale = localStorage.getItem('portfolio-locale')
          if (savedLocale === 'zh-Hans' || savedLocale === 'en') locale = savedLocale
        } catch {}
        document.documentElement.lang = locale
      })()
    </script>
    <meta name="description" content="学术、研究与软件作品集演示。" />
    <link rel="canonical" href="https://simon-hale.github.io" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="学术与开发者作品集" />
    <meta property="og:description" content="学术、研究与软件作品集演示。" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Portfolio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
